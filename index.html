<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clutterspace</title>
<meta name="theme-color" content="#14161c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<style>
:root{
  --bg:#14161c; --panel:#1c1f27; --panel2:#232733; --line:#2d3240; --text:#eceef3; --muted:#9aa1b2;
  --accent:#ffb454; --accent-ink:#241600; --danger:#ff6b6b; --ok:#6ee7a8;
  --r:14px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f5f3ee;--panel:#fff;--panel2:#f0ede6;--line:#e1ddd2;--text:#1b1d22;--muted:#6a6f7d;--accent:#d97706;--accent-ink:#fff;}
}
:root[data-theme="light"]{--bg:#f5f3ee;--panel:#fff;--panel2:#f0ede6;--line:#e1ddd2;--text:#1b1d22;--muted:#6a6f7d;--accent:#d97706;--accent-ink:#fff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0 auto 0 0;letter-spacing:-.2px}
h1 span{color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:13px;border-radius:8px}
.search{flex:1 1 220px;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.search:focus,input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.sync{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--text)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on b{color:var(--accent-ink)}
.chip.drop{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 7px}
.tag.on{border-color:var(--accent);color:var(--accent)}
.revisit{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.revisit h2{font-size:13px;margin:0 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.revisit .row{display:flex;gap:8px;flex-wrap:wrap}
.mini{flex:1 1 220px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.mini:hover{border-color:var(--accent)}
.mini small{color:var(--muted);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.card.dragging{opacity:.4}
.card:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.card.seen .ttl{color:var(--muted)}
.top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.src{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--text)}
.star{margin-left:auto;background:none;border:0;font-size:18px;line-height:1;color:var(--muted);padding:2px 4px}
.star.on{color:var(--accent)}
.ttl{font-weight:600;font-size:15px;word-break:break-word}
.note{color:var(--muted);font-size:14px;white-space:pre-wrap;word-break:break-word}
.url{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{text-align:center;color:var(--muted);padding:56px 16px;border:1px dashed var(--line);border-radius:var(--r)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:16px;display:grid;gap:10px}
.dlg h3{margin:0 0 2px}
label{font-size:12px;color:var(--muted);display:grid;gap:4px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:min(520px,calc(100vw - 24px));text-align:center}
.toast.show{opacity:1}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none;z-index:5}
@media (max-width:640px){.fab{display:inline-flex}.hide-sm{display:none}}
.hint{font-size:12px;color:var(--muted)}
.tile{cursor:pointer;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px)}
.thumb{margin:-12px -12px 2px;height:150px;overflow:hidden;border-radius:var(--r) var(--r) 0 0;background:var(--panel2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.autob{font-size:12px;margin-left:4px;opacity:.7}
.banner{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.banner.show{display:flex}
.banner .btn{background:transparent;color:inherit;border-color:currentColor}
.banner span{margin-right:auto}

/* ===== Clutterspace v3: tiles with thumbnails + mobile header ===== */
.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card.tile{padding:0;gap:0;overflow:hidden}
.thumb{position:relative;margin:0;height:auto;aspect-ratio:4/5;border-radius:0;background:var(--panel2);overflow:hidden}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,hsl(var(--h,30) 45% 30%),hsl(calc(var(--h,30) + 40) 50% 18%));color:rgba(255,255,255,.85);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .src{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;border:0;backdrop-filter:blur(4px);font-size:11px}
.thumb .star,.thumb .edit{position:absolute;top:6px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0;backdrop-filter:blur(4px)}
.thumb .star{right:6px;margin:0}
.thumb .star.on{color:var(--accent)}
.thumb .edit{left:6px}
.cbody{padding:10px 12px 12px;display:grid;gap:6px}
.card .ttl{font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cbody .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.colchip{font-size:11px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:999px;padding:1px 8px}
.cbody .note{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.seen .thumb img{filter:saturate(.55) brightness(.85)}
.big .thumb{aspect-ratio:4/5;max-height:56vh;border-radius:12px}
.big .cbody{padding:12px 2px 2px}
.big .ttl{font-size:17px;-webkit-line-clamp:4}
.big{cursor:pointer}
#sdlg{width:min(380px,calc(100vw - 24px))}
header{align-items:center}
@media (max-width:640px){
  .wrap{padding:12px 12px 90px}
  header{flex-wrap:wrap;gap:8px}
  h1{flex:1 0 100%;text-align:center;margin:0 0 2px;font-size:22px}
  header .search{flex:1 1 0;min-width:0}
  header .lbl{display:none}
  header .btn{padding:9px 12px;flex:0 0 auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cbody{padding:8px 9px 10px}
  .card .ttl{font-size:13.5px;-webkit-line-clamp:2}
  .cbody .note{display:none}
  .cbody .tagrow{display:none}
  .revisit{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Clutter<span>space</span></h1>
    <input id="q" class="search" type="search" placeholder="Search links, notes, tags…" aria-label="Search">
    <span id="sync" class="sync hide-sm"></span>
    <button class="btn" id="surprise" title="Surprise me: preview a random save" aria-label="Surprise me">🎲<span class="lbl"> Surprise me</span></button>
    <button class="btn primary hide-sm" id="add">＋ Add link</button>
    <button class="btn" id="menu" aria-label="Menu">⋯</button>
  </header>

  <div class="banner" id="banner" role="status"></div>
  <div class="chips" id="cols" aria-label="Collections"></div>
  <div class="tagrow" id="tags"></div>
  <div id="revisit"></div>
  <div class="grid" id="grid"></div>
  <p class="hint" style="margin-top:18px">Tip: drag a card onto a collection above to move it. Cards you open turn grey so you can see what you haven't revisited yet.</p>
</div>
<button class="btn primary fab" id="fab" aria-label="Add link">＋</button>
<div class="toast" id="toast"></div>

<dialog id="dlg"><form method="dialog" class="dlg" id="form">
  <h3 id="dtitle">Save a link</h3>
  <label>Link<input id="f-url" type="url" placeholder="https://www.instagram.com/reel/…" required></label>
  <label>Title <span class="hint">(leave blank and it's filled in automatically)</span><input id="f-title" placeholder="Auto"></label>
  <label>Your note / caption hint (optional)<textarea id="f-note" placeholder="Why you saved it, or paste/describe the reel if Instagram hid the caption."></textarea></label>
  <label>Collection<select id="f-col"></select></label>
  <label>Tags (comma separated, optional)<input id="f-tags" placeholder="Auto from hashtags"></label>
  <div class="foot">
    <button type="button" class="btn danger" id="f-del" hidden>Delete</button>
    <button type="button" class="btn" id="f-cancel">Cancel</button>
    <button class="btn primary" id="f-save" value="save">Save</button>
  </div>
</form></dialog>

<dialog id="sdlg"><div class="dlg" style="padding:12px">
  <div id="s-tile"></div>
  <p class="hint" style="margin:0;text-align:center">Tap the tile to open the reel</p>
  <div class="foot" style="justify-content:space-between"><button type="button" class="btn" id="s-shuffle">🎲 Shuffle</button><button type="button" class="btn" id="s-close">Close</button></div>
</div></dialog>

<dialog id="mdlg"><div class="dlg">
  <h3>Menu</h3>
  <p class="hint" id="m-sync" style="margin:0"></p>
  <button class="btn" id="m-resort">✨ Re-sort & refill details</button>
  <button class="btn" id="m-col">＋ New collection</button>
  <button class="btn" id="m-theme">◐ Toggle light / dark</button>
  <button class="btn" id="m-export">⬇ Export backup (JSON)</button>
  <button class="btn" id="m-import">⬆ Import backup</button>
  <input type="file" id="m-file" accept="application/json" hidden>
  <button class="btn" id="m-login">🔐 Sync across devices</button>
  <div class="foot"><button class="btn" id="m-close">Close</button></div>
</div></dialog>

<dialog id="ldlg"><form class="dlg" id="lform">
  <h3>Sync across devices</h3>
  <p class="hint" id="l-info"></p>
  <div id="l-fields" style="display:grid;gap:10px">
    <label>Email (this is your username)<input id="l-email" type="email" autocomplete="username" placeholder="you@example.com"></label>
    <label>Password (6+ characters)<input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
  </div>
  <div class="foot"><button type="button" class="btn" id="l-out" hidden>Sign out</button><button type="button" class="btn" id="l-cancel">Close</button><button type="button" class="btn" id="l-up">Create account</button><button type="submit" class="btn primary" id="l-in">Sign in</button></div>
</form></dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script defer>
(function(){
const $ = (s)=>document.querySelector(s);
const DEFAULT_COLS = ["Inbox","Content ideas","UI/UX","Development","Books","Anime","Movies","Jobs"];
const LS_ITEMS="il.items.v1", LS_COLS="il.cols.v1", LS_THEME="il.theme";
const safe = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let items = safe.get(LS_ITEMS, []);
let extraCols = safe.get(LS_COLS, []);
let state = {col:"All", tag:null, q:"", editing:null};
let sb=null, user=null;

const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : "id"+Date.now()+Math.random().toString(16).slice(2));
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m,ms=2800){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),ms)}

function source(u){
  try{const h=new URL(u).hostname.replace(/^www\./,"");
    if(/instagram\.com/.test(h))return "Instagram";
    if(/youtu\.?be/.test(h))return "YouTube";
    if(/twitter\.com|x\.com/.test(h))return "X";
    if(/linkedin\.com/.test(h))return "LinkedIn";
    if(/reddit\.com/.test(h))return "Reddit";
    if(/github\.com/.test(h))return "GitHub";
    if(/tiktok\.com/.test(h))return "TikTok";
    return h;
  }catch(e){return "Link"}
}
function isPlaceholderTitle(t){
  const s=String(t||"").trim();
  if(!s)return true;
  if(/^(untitled idea|saved link|instagram|youtube|tiktok|login\s*[•·-]\s*instagram|log in\s*[•·-]\s*instagram)$/i.test(s))return true;
  if(/^(instagram|youtube|x|linkedin|reddit|github|tiktok|link)\s+(reel|post|video|short|link)(\s*[·•-]\s*[\w-]+)?$/i.test(s))return true;
  if(/create an account or log in to instagram/i.test(s))return true;
  return false;
}
function allCols(){
  const set=[...DEFAULT_COLS];
  [...extraCols, ...items.map(i=>i.collection)].forEach(c=>{if(c&&!set.includes(c))set.push(c)});
  return set;
}
function syncItemInList(it){
  const idx=items.findIndex(x=>x.id===it.id);
  if(idx!==-1)items[idx]=it;
}
function persist(){safe.set(LS_ITEMS,items);safe.set(LS_COLS,extraCols)}

/* ---------- remote sync (optional) ---------- */
async function initSync(){
  const cfg = window.CONFIG||{};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){setSyncLabel();return}
  sb = window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const {data} = await sb.auth.getSession();
  user = data.session?data.session.user:null;
  sb.auth.onAuthStateChange((_e,s)=>{const was=user;user=s?s.user:null;setSyncLabel();if(user&&!was)pull()});
  setSyncLabel();
  if(user)await pull();
}
function setSyncLabel(){
  const t = !sb ? "Saved on this device only" : user ? "☁ Synced" : "Not signed in";
  $("#sync").textContent=t; const m=$("#m-sync"); if(m)m.textContent=t+(user?" · "+user.email:"");
}
function toRow(i){return {id:i.id,user_id:user.id,url:i.url,title:i.title,note:i.note,description:i.desc||"",image:i.image||"",auto:!!i.auto,manual:!!i.manual,collection:i.collection,tags:i.tags,starred:i.starred,seen:i.seen,created_at:i.created_at}}
async function pull(){
  if(!sb||!user)return;
  const {data,error}=await sb.from("items").select("*").order("created_at",{ascending:false});
  if(error){toast("Sync error: "+error.message);return}
  const prevById=new Map(items.map(i=>[i.id,i]));
  const remoteIds=new Set(data.map(r=>r.id));
  const localOnly=items.filter(i=>!remoteIds.has(i.id));
  if(localOnly.length){await sb.from("items").upsert(localOnly.map(toRow))}
  items=[...data.map(r=>{
    const prev=prevById.get(r.id)||{};
    const title=r.title||prev.title||"";
    const auto=r.auto==null?true:(!!r.auto||isPlaceholderTitle(title));
    return {
      ...prev,
      id:r.id,
      url:r.url,
      title,
      note:r.note||"",
      desc:r.description||prev.desc||"",
      image:r.image||prev.image||"",
      auto,
      manual:!!r.manual,
      collection:r.collection||"Inbox",
      tags:r.tags||[],
      starred:!!r.starred,
      seen:!!r.seen,
      created_at:r.created_at
    };
  }),...localOnly];
  persist();render();setSyncLabel();
}
async function push(item){ if(sb&&user){const {error}=await sb.from("items").upsert(toRow(item)); if(error)toast("Sync error: "+error.message)} }
async function removeRemote(id){ if(sb&&user){await sb.from("items").delete().eq("id",id)} }

/* ---------- rendering ---------- */
function filtered(){
  const q=state.q.trim().toLowerCase();
  return items.filter(i=>{
    if(state.col==="★ Starred"&&!i.starred)return false;
    if(state.col!=="All"&&state.col!=="★ Starred"&&i.collection!==state.col)return false;
    if(state.tag&&!(i.tags||[]).includes(state.tag))return false;
    if(q){const hay=(i.title+" "+i.note+" "+(i.desc||"")+" "+i.url+" "+(i.tags||[]).join(" ")+" "+i.collection).toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
}
function render(){
  const cols=allCols();
  const count=(c)=>items.filter(i=>i.collection===c).length;
  const names=["All","★ Starred",...cols];
  $("#cols").innerHTML=names.map(c=>{
    const n=c==="All"?items.length:c==="★ Starred"?items.filter(i=>i.starred).length:count(c);
    return `<button class="chip ${state.col===c?"on":""}" data-col="${esc(c)}">${esc(c)} <b>${n}</b></button>`;
  }).join("");
  // tags
  const tc={};items.forEach(i=>(i.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  const tags=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,24);
  $("#tags").innerHTML=tags.map(t=>`<button class="tag ${state.tag===t?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("");
  // revisit nudge: oldest unseen
  const unseen=items.filter(i=>!i.seen).sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||"")).slice(0,3);
  $("#revisit").innerHTML=(unseen.length&&state.col==="All"&&!state.q&&!state.tag)?`<div class="revisit"><h2>Revisit — saved but never opened</h2><div class="row">${unseen.map(i=>`<button class="mini" data-open="${i.id}"><b>${esc(i.title||source(i.url))}</b><small>${esc(i.collection)} · ${esc(source(i.url))}</small></button>`).join("")}</div></div>`:"";
  const list=filtered();
  $("#grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty" style="grid-column:1/-1">${items.length?"Nothing matches this filter.":"Your library is empty.<br>Share a reel to this app from your phone, or tap “Add link”."}</div>`;
}
function hue(str){let h=0;for(const c of String(str))h=(h*31+c.charCodeAt(0))%360;return h}
function thumbBlock(i,withActions){
  const src=source(i.url);
  return `<div class="thumb"><div class="ph" style="--h:${hue(i.collection+src)}">${esc(src)}</div>
    ${i.image?`<img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}
    <span class="src">${esc(src)}</span>
    ${withActions?`<button class="edit" data-edit="${i.id}" aria-label="Edit">✎</button><button class="star ${i.starred?"on":""}" data-star="${i.id}" aria-label="Star">${i.starred?"★":"☆"}</button>`:""}
  </div>`;
}
function card(i){
  const body=i.note||i.desc||"";
  const dispTitle=i.title||fallbackTitle(i.url);
  return `<article class="card tile ${i.seen?"seen":""}" draggable="true" data-id="${i.id}" data-open="${i.id}">
    ${thumbBlock(i,true)}
    <div class="cbody">
      <div class="ttl">${esc(dispTitle)}${(i.auto||isPlaceholderTitle(i.title))?`<span class="autob" title="Title was generated automatically. Tap ✎ to change it.">✨</span>`:""}</div>

function hashtags(txt){return [...new Set((String(txt).match(/#([a-z0-9_]{2,30})/gi)||[]).map(h=>h.slice(1).toLowerCase()))].slice(0,6)}
function classify(it){
  const cleanT=isPlaceholderTitle(it.title)?"":it.title;
  const text=(" "+[cleanT,it.desc,it.note,(it.tags||[]).join(" ")].join(" ").toLowerCase()+" ");
  let best="Inbox",bestScore=0;
  const rules={...RULES};
  extraCols.forEach(c=>{if(!rules[c])rules[c]=[c.toLowerCase()]});
  for(const [col,kws] of Object.entries(rules)){
    let s=0;
    for(const k of kws){
      const re=k.length<=3?new RegExp("(^|[^a-z0-9])"+k.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+"([^a-z0-9]|$)"):null;

function stripIgBoilerplate(s){
  if(!s)return "";
  let t=String(s).trim();
  if(/create an account or log in to instagram/i.test(t))return "";
  if(/^(instagram|youtube|tiktok|login\s*[•·-]\s*instagram|log in\s*[•·-]\s*instagram)$/i.test(t))return "";
  // Strip "12K likes, 45 comments - user on Date: "
  t=t.replace(/^[\d,.]+[KMBkmb]?\s+likes?,\s*[\d,.]+[KMBkmb]?\s+comments?\s*[-–—]\s*[^:：]+?\s+on\s+[A-Za-z]+\s+\d{1,2},\s*\d{4}\s*[:：]\s*/i,"");
  // Strip "Name on Instagram: "
  t=t.replace(/^[^:：\n]{1,70}\s+on\s+Instagram\s*[:：]\s*/i,"");
  const q=t.match(/^["“']([\s\S]+?)["”']\.?\s*$/);
  if(q)t=q[1].trim();
  return t.trim();
}
function cleanTitle(meta,url,note){
  const candidates=[meta&&meta.title, meta&&meta.description, note];
  for(const raw of candidates){
    let t=stripIgBoilerplate(raw);
    if(!t||isPlaceholderTitle(t))continue;
    if(/^[\d,.]+[KMBkmb]?\s+(likes|views|comments)/i.test(t)){
      if(/[:：]/.test(t))t=t.replace(/^.*?[:：]\s*/,"");
      else continue;
    }
    // Extract first meaningful line before hashtag block
    const noTags=t.replace(/#[\p{L}\p{N}_]+/gu,"").replace(/\s+/g," ").trim();
    if(noTags&&!isPlaceholderTitle(noTags)){
      t=noTags;
    }else{
      // If caption was only hashtags, convert hashtags into readable words
      const tags=hashtags(t);
      if(tags.length)t=tags.slice(0,4).join(" · ");
      else continue;
    }
    if(t.length>76){t=t.slice(0,76);t=t.slice(0,Math.max(t.lastIndexOf(" "),36))+"…"}
    return t;
  }
  return fallbackTitle(url);
}
function fallbackTitle(url){
  try{const u=new URL(url);const kind=/\/reel/.test(u.pathname)?"reel":/\/p\//.test(u.pathname)?"post":/youtu/.test(u.hostname)?"video":"link";
    const id=u.pathname.split("/").filter(Boolean).pop()||"";
    return source(url)+" "+kind+(id?" · "+id.slice(0,8):"");}catch(e){return "Saved link"}
}
async function callFn(path,opt){
  try{
    const r=await fetch("/.netlify/functions/"+path,opt);
    if(r.status===404)return {error:"fn_404",status:404};
    if(r.ok)return await r.json();
    return {error:"http_"+r.status,status:r.status};
  }catch(e){return {error:"network"}}
}
async function fetchClientMeta(url){
  // Browser-side fallback using public CORS-enabled metadata endpoints when server function is blocked or 404
  try{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),4500);
    const r=await fetch("https://api.microlink.io/?url="+encodeURIComponent(url),{signal:ctl.signal});
    clearTimeout(timer);
    if(r.ok){
      const j=await r.json();
      const d=(j&&j.data)||{};
      const title=stripIgBoilerplate(d.title||"");
      const description=stripIgBoilerplate(d.description||"");
      const image=(d.image&&d.image.url)||"";
      const author=d.author||"";
      if(title||description||image)return {title,description,image,author};
    }
  }catch(e){}
  try{
    const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent(url));
    if(r.ok){
      const j=await r.json();
      if(j&&!j.error&&(j.title||j.thumbnail_url)){
        return {title:j.title||"",description:j.author_name||"",image:j.thumbnail_url||"",author:j.author_name||""};
      }
    }
  }catch(e){}
  return null;
}
function ytThumb(url){try{const u=new URL(url);let id="";if(/youtu\.be$/.test(u.hostname))id=u.pathname.slice(1);else if(/youtube\.com$/.test(u.hostname))id=u.searchParams.get("v")||(u.pathname.match(/\/(shorts|embed)\/([\w-]{6,})/)||[])[2]||"";return id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:""}catch(e){return ""}}
async function cacheThumb(it,src){
  try{
    const r=await fetch("/.netlify/functions/img?url="+encodeURIComponent(src));
    if(!r.ok){
      // Fallback: use direct image URL if proxy function is unavailable
      if(it.image.startsWith("/.netlify/")){it.image=src;syncItemInList(it);persist();render();push(it)}
      return;
    }
    const blob=await r.blob();
    if(sb&&user){
      const path=`${user.id}/${it.id}.jpg`;
      const {error}=await sb.storage.from("thumbs").upload(path,blob,{upsert:true,contentType:blob.type||"image/jpeg"});
      if(!error){it.image=sb.storage.from("thumbs").getPublicUrl(path).data.publicUrl+"?v="+(Date.now()%100000);syncItemInList(it);persist();render();push(it);return}
    }
    if(blob.size<120000){const fr=new FileReader();fr.onload=()=>{it.image=fr.result;syncItemInList(it);persist();render();push(it)};fr.readAsDataURL(blob)}
  }catch(e){}
}
async function enrich(it){
  const metaRes=await callFn("meta?url="+encodeURIComponent(it.url));
  let ok=(metaRes&&!metaRes.error)?metaRes:null;
  // If server scrape returned nothing or 404, try browser-side metadata fallback
  if(!ok||(!ok.title&&!ok.description&&!ok.image)){
    const clientMeta=await fetchClientMeta(it.url);
    if(clientMeta){
      ok={
        title:(ok&&ok.title)||clientMeta.title||"",
        description:(ok&&ok.description)||clientMeta.description||"",
        image:(ok&&ok.image)||clientMeta.image||"",
        author:(ok&&ok.author)||clientMeta.author||""
      };
    }
  }
  const rawTitle=ok?stripIgBoilerplate(ok.title||""):"";
  const rawDesc=ok?stripIgBoilerplate(ok.description||""):stripIgBoilerplate(it.desc||"");
  const rawAuthor=ok?ok.author||"":"";
  const canUpdateTitle=it.auto||isPlaceholderTitle(it.title);

  // thumbnail: show immediately, then store a permanent copy
  if(!it.image||/^\/\.netlify\//.test(it.image)){
    const yt=ytThumb(it.url);
    if(yt)it.image=yt;
    else if(ok&&ok.image){
      if(metaRes&&metaRes.error==="fn_404"){it.image=ok.image}
      else{it.image="/.netlify/functions/img?url="+encodeURIComponent(ok.image);cacheThumb(it,ok.image)}
    }
  }

  // Gemini: title + collection + tags + one-line summary
  const existingCustomTitle=(!isPlaceholderTitle(it.title)&&!it.auto)?it.title:"";
  const ai=await callFn("ai",{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({
      url:it.url,
      title:rawTitle||existingCustomTitle,
      description:rawDesc,
      note:it.note,
      author:rawAuthor,
      collections:allCols()
    })
  });

  if(ai&&!ai.error){
    if(canUpdateTitle){
      it.title=ai.title||cleanTitle({title:rawTitle,description:rawDesc},it.url,it.note);
      it.auto=true;
    }
    if(!(it.tags||[]).length){
      it.tags=(ai.tags&&ai.tags.length)?ai.tags:hashtags(rawTitle+" "+rawDesc+" "+(it.note||""));
    }
    it.desc=ai.summary||rawDesc||it.desc||"";
    if(!it.manual){
      const picked=(ai.collection&&ai.collection!=="Inbox")?ai.collection:classify({...it,title:it.title,desc:it.desc});
      it.collection=picked||"Inbox";
    }
    it.ai=true;
    it.lastError="";
  }else{
    if(canUpdateTitle){
      it.title=cleanTitle({title:rawTitle,description:rawDesc},it.url,it.note);
      it.auto=true;
    }
    if(rawDesc&&!it.desc)it.desc=rawDesc;
    if(!(it.tags||[]).length)it.tags=hashtags(rawTitle+" "+rawDesc+" "+(it.note||""));
    if(!it.manual)it.collection=classify(it);
    it.lastError=(ai&&ai.error)||(metaRes&&metaRes.error)||"";
  }
  it.enriched=!!ok||!!it.ai;
  it.tries=(it.tries||0)+1;
  syncItemInList(it);
  persist();render();await push(it);
  return it;
}

document.addEventListener("dragend",(e)=>{document.querySelectorAll(".dragging,.drop").forEach(n=>n.classList.remove("dragging","drop"));dragId=null});
$("#cols").addEventListener("dragover",(e)=>{const c=e.target.closest(".chip");if(!c||!dragId)return;e.preventDefault();document.querySelectorAll(".chip.drop").forEach(n=>n.classList.remove("drop"));c.classList.add("drop")});
$("#cols").addEventListener("drop",(e)=>{const c=e.target.closest(".chip");if(!c||!dragId)return;e.preventDefault();const col=c.dataset.col;if(col!=="All"&&col!=="★ Starred")move(dragId,col)});

/* ---------- boot ---------- */
if(safe.get(LS_THEME,null))document.documentElement.dataset.theme=safe.get(LS_THEME,null);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}
function handleShare(){
  const p=new URLSearchParams(location.search);
  const raw=[p.get("url"),p.get("text"),p.get("title")].filter(Boolean).join(" ");
  if(!raw)return;
  const m=raw.match(/https?:\/\/[^\s]+/);
  history.replaceState(null,"",location.pathname);
  if(!m){banner("Nothing to save: the share didn't include a link.");return}
  const url=normUrl(m[0]);
  const extraText=stripIgBoilerplate(raw.replace(/https?:\/\/[^\s]+/g,"").trim());
  const dupe=items.find(i=>i.url===url);
  if(dupe){banner("Already in your library under “"+dupe.collection+"”.",dupe);return}
  // Auto-save instantly: no form. Details are filled in a moment later.
  const it=newItem(url);
  it.title=fallbackTitle(url);
  if(extraText&&!isPlaceholderTitle(extraText))it.desc=extraText;
  items.unshift(it);persist();render();push(it);
  banner("✓ Saved. Sorting it for you…",it);
  enrich(it).then(()=>banner("✓ Saved to “"+it.collection+"”: "+it.title,it));
}
render();
async function finishPending(){
  // If the app was closed right after a share, fill in whatever is still missing (max 3 tries per item).
  const todo=items.filter(i=>!i.ai&&(i.tries||0)<3&&(i.auto||isPlaceholderTitle(i.title)||!i.manual||!i.image)).slice(0,10);
  for(const it of todo){await enrich(it)}
}
window.addEventListener("load",async()=>{await initSync();handleShare();finishPending()});
})();
</script>
