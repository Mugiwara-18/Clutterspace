<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clutterspace</title>
<meta name="theme-color" content="#1674b1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 90s Studio Ghibli Daylight Palette (Cream Paper, Terracotta Cart, Summer Sky, Meadow Green) */
  --bg:#1b7ab8;
  --panel:rgba(251, 247, 237, 0.86);
  --panel-solid:#fbf7ed;
  --panel2:rgba(242, 235, 220, 0.82);
  --line:rgba(68, 52, 36, 0.15);
  --line-strong:rgba(68, 52, 36, 0.28);
  --text:#26201a;
  --muted:#685d50;
  --accent:#c8523b;        /* Terracotta Red Cart */
  --accent-hover:#b3442e;
  --accent-ink:#fffaf3;
  --meadow:#4f7736;        /* Ghibli Meadow Green */
  --sky:#186fa8;           /* Ghibli Cerulean Sky */
  --danger:#c93b3b;
  --ok:#3f7d48;
  --r:16px;
  /* Minimal, low-key frosted glass: soft matte paper feel with very gentle blur */
  --glass-blur:blur(6px);
  --shadow:0 6px 20px -4px rgba(28, 36, 24, 0.16), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
}
:root[data-theme="dark"]{
  /* 90s Ghibli Evening / Starry Coast Palette */
  --bg:#132235;
  --panel:rgba(23, 33, 46, 0.85);
  --panel-solid:#182230;
  --panel2:rgba(32, 45, 62, 0.82);
  --line:rgba(245, 238, 222, 0.14);
  --line-strong:rgba(245, 238, 222, 0.28);
  --text:#f4efe4;
  --muted:#a9b3be;
  --accent:#df684f;
  --accent-hover:#eb7960;
  --accent-ink:#fffaf3;
  --meadow:#7ca85c;
  --sky:#58a6d8;
  --shadow:0 8px 24px -6px rgba(8, 14, 22, 0.45), 0 1px 0 rgba(255, 255, 255, 0.08) inset;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background-color:var(--bg);
  color:var(--text);
  font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
}
/* Hand-painted 90s Studio Ghibli background canvas */
.bg-scene{
  position:fixed;
  inset:0;
  z-index:0;
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  transition:background-image .35s ease;
}
/* Gentle atmospheric wash so text and cards stay effortlessly readable */
.bg-scene::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(250, 246, 235, 0.12) 0%, rgba(24, 42, 32, 0.18) 100%);
}
:root[data-theme="dark"] .bg-scene::after{
  background:linear-gradient(180deg, rgba(12, 20, 32, 0.42) 0%, rgba(10, 16, 26, 0.58) 100%);
}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 80px;position:relative;z-index:1}

/* ===== Header Bar (Low-key matte glass + Ghibli paper warmth) ===== */
header{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:14px;
  padding:11px 15px;
  border-radius:18px;
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 auto 0 0;
}
h1{
  font-family:"Fraunces",Georgia,serif;
  font-weight:700;
  font-size:23px;
  margin:0;
  letter-spacing:-.02em;
  color:var(--text);
}
h1 span{color:var(--accent)}
.bebop-tag{
  font-size:11px;
  font-weight:600;
  color:var(--meadow);
  padding:2px 8px;
  border-radius:999px;
  background:rgba(79, 119, 54, 0.12);
  border:1px solid rgba(79, 119, 54, 0.25);
}

/* ===== Buttons & Inputs ===== */
.btn{
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px 12px;
  display:inline-flex;
  gap:6px;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:14px;
  box-shadow:0 2px 6px rgba(30,24,18,0.06);
  transition:transform .14s ease, border-color .14s ease, background .14s ease;
}
.btn:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}
.btn:active{transform:translateY(0)}
.btn.primary{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
  font-weight:600;
}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}

.search{
  flex:1 1 220px;
  min-width:160px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 12px;
}
.search::placeholder{color:var(--muted)}
.search:focus,input:focus,select:focus,textarea:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.sync{
  font-size:12px;
  font-weight:500;
  color:var(--muted);
}

/* ===== Collection Chips ===== */
.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 2px 12px;
  scrollbar-width:thin;
}
.chip{
  flex:0 0 auto;
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 13px;
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  display:inline-flex;
  gap:6px;
  align-items:center;
  box-shadow:0 2px 8px rgba(28,36,24,0.08);
  transition:border-color .14s, transform .14s, background .14s;
}
.chip:hover{
  border-color:var(--line-strong);
  color:var(--text);
}
.chip b{
  font-weight:700;
  font-size:12px;
  color:var(--text);
}
.chip.on{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}
.chip.on b{color:var(--accent-ink)}
.chip.drop{
  border-color:var(--meadow);
  box-shadow:0 0 0 3px rgba(79, 119, 54, 0.3);
}

/* ===== Revisit Strip ===== */
.revisit{
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:12px 14px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.revisit h2{
  font-family:"Fraunces",Georgia,serif;
  font-size:13.5px;
  margin:0 0 8px;
  color:var(--meadow);
  letter-spacing:.02em;
}
.revisit .row{display:flex;gap:8px;flex-wrap:wrap}
.mini{
  flex:1 1 220px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px 11px;
  text-align:left;
  transition:border-color .14s, transform .14s;
}
.mini:hover{border-color:var(--accent);transform:translateY(-1px)}
.mini b{
  display:block;
  font-size:13.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.mini small{color:var(--muted);display:block;font-size:11.5px;margin-top:2px}

/* ===== Cards Grid ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  gap:14px;
}
.card.tile{
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.card.tile:hover{
  transform:translateY(-3px);
  border-color:var(--accent);
  box-shadow:0 12px 26px -6px rgba(28, 36, 24, 0.22);
}
.card.dragging{opacity:.45}
.card.seen .ttl{color:var(--muted)}
.card.seen .thumb img{filter:saturate(.65) brightness(.9)}

.thumb{
  position:relative;
  margin:0;
  height:auto;
  aspect-ratio:4/5;
  background:var(--panel2);
  overflow:hidden;
  border-bottom:1px solid var(--line);
}
/* 90s Ghibli gouache-toned placeholder when a reel has no image */
.thumb .ph{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  background:linear-gradient(160deg, hsl(var(--h, 200) 48% 42%), hsl(calc(var(--h, 200) - 35) 42% 28%));
  color:#fbf7ed;
  font-family:"Fraunces",Georgia,serif;
  font-weight:600;
  font-size:16px;
  letter-spacing:.02em;
}
.thumb img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.thumb .src{
  position:absolute;
  left:8px;
  bottom:8px;
  background:rgba(34, 28, 22, 0.68);
  color:#fbf7ed;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:7px;
  padding:2px 8px;
  font-size:11px;
  font-weight:500;
  backdrop-filter:blur(4px);
}
.thumb .star,.thumb .edit{
  position:absolute;
  top:7px;
  width:33px;
  height:33px;
  border-radius:50%;
  background:rgba(34, 28, 22, 0.62);
  color:#fbf7ed;
  border:1px solid rgba(255,255,255,0.22);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  padding:0;
  backdrop-filter:blur(4px);
}
.thumb .star{right:7px;margin:0}
.thumb .star.on{color:#ffca58}
.thumb .edit{left:7px}

.cbody{padding:10px 12px 12px;display:grid;gap:6px}
.card .ttl{
  font-family:"Fraunces",Georgia,serif;
  font-weight:600;
  font-size:14.5px;
  line-height:1.3;
  word-break:break-word;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.autob{font-size:12px;margin-left:4px;opacity:.75;color:var(--accent)}
.cbody .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.colchip{
  font-size:11px;
  font-weight:600;
  color:var(--meadow);
  background:rgba(79, 119, 54, 0.11);
  border:1px solid rgba(79, 119, 54, 0.28);
  border-radius:999px;
  padding:1px 8px;
}
.cbody .note{
  color:var(--muted);
  font-size:12.5px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.empty{
  text-align:center;
  color:var(--text);
  padding:52px 18px;
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px dashed var(--line-strong);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}

/* ===== Dialogs ===== */
dialog{
  background:var(--panel-solid);
  color:var(--text);
  border:1px solid var(--line-strong);
  border-radius:18px;
  padding:0;
  width:min(510px,calc(100vw - 24px));
  box-shadow:0 24px 60px rgba(20, 24, 18, 0.35);
}
dialog::backdrop{background:rgba(18, 24, 20, 0.5)}
.dlg{padding:16px;display:grid;gap:10px}
.dlg h3{
  font-family:"Fraunces",Georgia,serif;
  font-size:19px;
  margin:0 0 2px;
}
label{font-size:12px;color:var(--muted);display:grid;gap:4px}
input,select,textarea{
  background:var(--panel2);
  border:1px solid var(--line-strong);
  border-radius:10px;
  padding:9px 10px;
  width:100%;
}
textarea{min-height:76px;resize:vertical}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}

.big .thumb{aspect-ratio:4/5;max-height:54vh;border-radius:12px}
.big .cbody{padding:12px 2px 2px}
.big .ttl{font-size:17px;-webkit-line-clamp:4}
.big{cursor:pointer}
#sdlg{width:min(380px,calc(100vw - 24px))}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:var(--text);
  color:var(--panel-solid);
  padding:9px 14px;
  border-radius:11px;
  font-size:13.5px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  z-index:20;
  max-width:min(520px,calc(100vw - 24px));
  text-align:center;
}
.toast.show{opacity:1}

.fab{
  position:fixed;
  right:16px;
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:54px;
  height:54px;
  border-radius:50%;
  font-size:28px;
  line-height:1;
  justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
  display:none;
  z-index:5;
}
.hint{font-size:12px;color:var(--muted)}
.signoff{
  margin-top:18px;
  padding:10px 14px;
  border-radius:12px;
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
.scene-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scene-btn{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 10px;
  font-size:11.5px;
  font-weight:600;
  color:var(--muted);
}
.scene-btn.on{
  background:var(--meadow);
  color:#fff;
  border-color:var(--meadow);
}

.banner{
  display:none;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--accent);
  color:var(--accent-ink);
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:12px;
  font-weight:600;
}
.banner.show{display:flex}
.banner .btn{background:transparent;color:inherit;border-color:currentColor}
.banner span{margin-right:auto}

/* ===== Mobile Header: Centered Clutterspace + Search + 🎲 + ⋯ on ONE line ===== */
@media (max-width:640px){
  .fab{display:inline-flex}
  .hide-sm{display:none !important}
  .wrap{padding:10px 10px 90px}
  header{
    flex-wrap:wrap;
    gap:8px;
    padding:10px 11px;
  }
  .brand{
    flex:1 0 100%;
    justify-content:center;
    margin:0 0 2px;
  }
  h1{text-align:center;font-size:22px}
  .bebop-tag{display:none}
  header .search{flex:1 1 0;min-width:0}
  header .lbl{display:none}
  header .btn{padding:9px 12px;flex:0 0 auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cbody{padding:8px 9px 10px}
  .card .ttl{font-size:13.5px;-webkit-line-clamp:2}
  .cbody .note{display:none}
  .revisit{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
  <defs><filter id="liquid-refract"></filter></defs>
</svg>
<div class="bg-scene" id="bg-scene"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Clutter<span>space</span></h1>
      <span class="bebop-tag">90s Meadow</span>
    </div>
    <input id="q" class="search" type="search" placeholder="Search links, notes, tags…" aria-label="Search">
    <span id="sync" class="sync hide-sm"></span>
    <button class="btn" id="surprise" title="Surprise me: preview a random save" aria-label="Surprise me">🎲<span class="lbl"> Surprise me</span></button>
    <button class="btn primary hide-sm" id="add">＋ Add link</button>
    <button class="btn" id="menu" aria-label="Menu">⋯</button>
  </header>

  <div class="banner" id="banner" role="status"></div>
  <div class="chips" id="cols" aria-label="Collections"></div>
  <div id="revisit"></div>
  <div class="grid" id="grid"></div>
  <div class="signoff">
    <p class="hint" style="margin:0">Tip: drag a card onto a collection above to move it. Cards you open dim so you can see what you haven't revisited yet.</p>
    <div class="scene-pills" id="scene-pills" aria-label="Background scene">
      <span class="hint">Scene:</span>
      <button type="button" class="scene-btn" data-scene="wide">Coast &amp; Cart</button>
      <button type="button" class="scene-btn" data-scene="cart">Tea Cart</button>
      <button type="button" class="scene-btn" data-scene="meadow">Meadow Vinyl</button>
      <button type="button" class="scene-btn" data-scene="sky">Swirling Sky</button>
    </div>
  </div>
</div>
<button class="btn primary fab" id="fab" aria-label="Add link">＋</button>
<div class="toast" id="toast"></div>

<dialog id="dlg"><form method="dialog" class="dlg" id="form">
  <h3 id="dtitle">Save a link</h3>
  <label>Link<input id="f-url" type="url" placeholder="https://www.instagram.com/reel/…" required></label>
  <label>Title <span class="hint">(leave blank and it's filled in automatically)</span><input id="f-title" placeholder="Auto"></label>
  <label>Your note / caption hint (optional)<textarea id="f-note" placeholder="Why you saved it, or paste/describe the reel if Instagram hid the caption."></textarea></label>
  <label>Collection<select id="f-col"></select></label>
  <label>Tags (comma separated, optional)<input id="f-tags" placeholder="Auto from hashtags"></label>
  <div class="foot">
    <button type="button" class="btn danger" id="f-del" hidden>Delete</button>
    <button type="button" class="btn" id="f-cancel">Cancel</button>
    <button class="btn primary" id="f-save" value="save">Save</button>
  </div>
</form></dialog>

<dialog id="sdlg"><div class="dlg" style="padding:14px">
  <div id="s-tile"></div>
  <p class="hint" style="margin:0;text-align:center">Tap the tile to open the reel</p>
  <div class="foot" style="justify-content:space-between"><button type="button" class="btn" id="s-shuffle">🎲 Shuffle</button><button type="button" class="btn" id="s-close">Close</button></div>
</div></dialog>

<dialog id="mdlg"><div class="dlg">
  <h3>Menu</h3>
  <p class="hint" id="m-sync" style="margin:0"></p>
  <button class="btn" id="m-resort">✨ Re-sort & refill details</button>
  <button class="btn" id="m-col">＋ New collection</button>
  <button class="btn" id="m-bg">🖼 Cycle background art</button>
  <button class="btn" id="m-theme">◐ Toggle light / dark</button>
  <button class="btn" id="m-export">⬇ Export backup (JSON)</button>
  <button class="btn" id="m-import">⬆ Import backup</button>
  <input type="file" id="m-file" accept="application/json" hidden>
  <button class="btn" id="m-login">🔐 Sync across devices</button>
  <div class="foot"><button class="btn" id="m-close">Close</button></div>
</div></dialog>

<dialog id="cdlg"><form class="dlg" id="cform">
  <h3>New collection</h3>
  <label>Collection name<input id="c-name" placeholder="e.g. Music, Design Systems, Gadgets" required></label>
  <div class="foot">
    <button type="button" class="btn" id="c-cancel">Cancel</button>
    <button type="submit" class="btn primary">Create</button>
  </div>
</form></dialog>

<dialog id="ldlg"><form class="dlg" id="lform">
  <h3>Sync across devices</h3>
  <p class="hint" id="l-info"></p>
  <div id="l-fields" style="display:grid;gap:10px">
    <label>Email (this is your username)<input id="l-email" type="email" autocomplete="username" placeholder="you@example.com"></label>
    <label>Password (6+ characters)<input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
  </div>
  <div class="foot"><button type="button" class="btn" id="l-out" hidden>Sign out</button><button type="button" class="btn" id="l-cancel">Close</button><button type="button" class="btn" id="l-up">Create account</button><button type="submit" class="btn primary" id="l-in">Sign in</button></div>
</form></dialog>

<script defer>
(function(){

function toast(m,ms=2800){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),ms)}

function source(u){
  try{const h=new URL(u).hostname.replace(/^www\./,"");
    if(/instagram\.com/.test(h))return "Instagram";
    if(/youtu\.?be/.test(h))return "YouTube";
    if(/twitter\.com|x\.com/.test(h))return "X";
    if(/linkedin\.com/.test(h))return "LinkedIn";
    if(/reddit\.com/.test(h))return "Reddit";
    if(/github\.com/.test(h))return "GitHub";
    if(/tiktok\.com/.test(h))return "TikTok";
    return h;
  }catch(e){return "Link"}
}
function isPlaceholderTitle(t){
  const s=String(t||"").trim();
  if(!s)return true;
  if(/^(untitled idea|saved link|instagram|youtube|tiktok|login\s*[•·-]\s*instagram|log in\s*[•·-]\s*instagram)$/i.test(s))return true;
  if(/^(instagram|youtube|x|linkedin|reddit|github|tiktok|link)\s+(reel|post|video|short|link)(\s*[·•-]\s*[\w-]+)?$/i.test(s))return true;
  if(/create an account or log in to instagram/i.test(s))return true;
  return false;
}

}

/* ---------- remote sync (optional) ---------- */
async function initSync(){
  const cfg = window.CONFIG||{};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){setSyncLabel();return}
  sb = window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const {data} = await sb.auth.getSession();
  user = data.session?data.session.user:null;
  sb.auth.onAuthStateChange((_e,s)=>{const was=user;user=s?s.user:null;setSyncLabel();if(user&&!was)pull()});
  setSyncLabel();
  if(user)await pull();
}
function setSyncLabel(){
  const t = !sb ? "Saved on this device" : user ? "☁ Synced" : "Not signed in";
  $("#sync").textContent=t; const m=$("#m-sync"); if(m)m.textContent=t+(user?" · "+user.email:"");
}
function toRow(i){return {id:i.id,user_id:user.id,url:i.url,title:i.title,note:i.note,description:i.desc||"",image:i.image||"",auto:!!i.auto,manual:!!i.manual,collection:i.collection,tags:i.tags,starred:i.starred,seen:i.seen,created_at:i.created_at}}
async function pull(){
  if(!sb||!user)return;
  const {data,error}=await sb.from("items").select("*").order("created_at",{ascending:false});
  if(error){toast("Sync error: "+error.message);return}
  items = items.filter(i=>!i.isDemo);
  const prevById=new Map(items.map(i=>[i.id,i]));
  const remoteIds=new Set(data.map(r=>r.id));
  const localOnly=items.filter(i=>!remoteIds.has(i.id));
  if(localOnly.length){await sb.from("items").upsert(localOnly.map(toRow))}
  items=[...data.map(r=>{
    const prev=prevById.get(r.id)||{};
    const title=r.title||prev.title||"";
    const auto=r.auto==null?true:(!!r.auto||isPlaceholderTitle(title));
    return {
      ...prev,
      id:r.id,
      url:r.url,
      title,
      note:r.note||"",
      desc:r.description||prev.desc||"",
      image:r.image||prev.image||"",
      auto,
      manual:!!r.manual,
      collection:r.collection||"Inbox",
      tags:r.tags||[],
      starred:!!r.starred,
      seen:!!r.seen,
      created_at:r.created_at
    };
  }),...localOnly];
  persist();render();setSyncLabel();
}
async function push(item){ if(sb&&user&&!item.isDemo){const {error}=await sb.from("items").upsert(toRow(item)); if(error)toast("Sync error: "+error.message)} }
async function removeRemote(id){ if(sb&&user){await sb.from("items").delete().eq("id",id)} }

function filtered(){
  const q=state.q.trim().toLowerCase();
  return items.filter(i=>{
    if(state.col==="★ Starred"&&!i.starred)return false;
    if(state.col!=="All"&&state.col!=="★ Starred"&&i.collection!==state.col)return false;
    if(state.tag&&!(i.tags||[]).includes(state.tag))return false;
    if(q){const hay=(i.title+" "+i.note+" "+(i.desc||"")+" "+i.url+" "+(i.tags||[]).join(" ")+" "+i.collection).toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
}
function render(){
  const cols=allCols();
  const count=(c)=>items.filter(i=>i.collection===c).length;
  const names=["All","★ Starred",...cols];
  $("#cols").innerHTML=names.map(c=>{
    const n=c==="All"?items.length:c==="★ Starred"?items.filter(i=>i.starred).length:count(c);
    return `<button class="chip ${state.col===c?"on":""}" data-col="${esc(c)}">${esc(c)} <b>${n}</b></button>`;
  }).join("");
  // revisit nudge: oldest unseen
  const unseen=items.filter(i=>!i.seen).sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||"")).slice(0,3);

}
function hue(str){let h=0;for(const c of String(str))h=(h*31+c.charCodeAt(0))%360;return h}

function hashtags(txt){return [...new Set((String(txt).match(/#([a-z0-9_]{2,30})/gi)||[]).map(h=>h.slice(1).toLowerCase()))].slice(0,6)}
function classify(it){
  const cleanT=isPlaceholderTitle(it.title)?"":it.title;
  const text=(" "+[cleanT,it.desc,it.note,(it.tags||[]).join(" ")].join(" ").toLowerCase()+" ");
  let best="Inbox",bestScore=0;
  const rules={...RULES};
  extraCols.forEach(c=>{if(!rules[c])rules[c]=[c.toLowerCase()]});
  for(const [col,kws] of Object.entries(rules)){
    let s=0;
    for(const k of kws){
      const re=k.length<=3?new RegExp("(^|[^a-z0-9])"+k.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+"([^a-z0-9]|$)"):null;
      if(re?re.test(text):text.includes(k))s+=text.includes("#"+k.replace(/\s+/g,""))?2:1;
    }
    if(s>bestScore){best=col;bestScore=s}
  }
  return best;
}
function stripIgBoilerplate(s){
  if(!s)return "";
  let t=String(s).trim();
  if(/create an account or log in to instagram/i.test(t))return "";
  if(/^(instagram|youtube|tiktok|login\s*[•·-]\s*instagram|log in\s*[•·-]\s*instagram)$/i.test(t))return "";
  t=t.replace(/^[\d,.]+[KMBkmb]?\s+likes?,\s*[\d,.]+[KMBkmb]?\s+comments?\s*[-–—]\s*[^:：]+?\s+on\s+[A-Za-z]+\s+\d{1,2},\s*\d{4}\s*[:：]\s*/i,"");
  t=t.replace(/^[^:：\n]{1,70}\s+on\s+Instagram\s*[:：]\s*/i,"");
  const q=t.match(/^["“']([\s\S]+?)["”']\.?\s*$/);
  if(q)t=q[1].trim();
  return t.trim();
}
function cleanTitle(meta,url,note){
  const candidates=[meta&&meta.title, meta&&meta.description, note];
  for(const raw of candidates){
    let t=stripIgBoilerplate(raw);
    if(!t||isPlaceholderTitle(t))continue;
    if(/^[\d,.]+[KMBkmb]?\s+(likes|views|comments)/i.test(t)){
      if(/[:：]/.test(t))t=t.replace(/^.*?[:：]\s*/,"");
      else continue;
    }
    const noTags=t.replace(/#[\p{L}\p{N}_]+/gu,"").replace(/\s+/g," ").trim();
    if(noTags&&!isPlaceholderTitle(noTags)){
      t=noTags;
    }else{
      const tags=hashtags(t);
      if(tags.length)t=tags.slice(0,4).join(" · ");
      else continue;
    }
    if(t.length>76){t=t.slice(0,76);t=t.slice(0,Math.max(t.lastIndexOf(" "),36))+"…"}
    return t;
  }
  return fallbackTitle(url);
}
function fallbackTitle(url){
  try{const u=new URL(url);const kind=/\/reel/.test(u.pathname)?"reel":/\/p\//.test(u.pathname)?"post":/youtu/.test(u.hostname)?"video":"link";
    const id=u.pathname.split("/").filter(Boolean).pop()||"";
    return source(url)+" "+kind+(id?" · "+id.slice(0,8):"");}catch(e){return "Saved link"}
}
async function callFn(path,opt){
  try{
    const fnBase=(location.origin&&location.origin!=="null"?location.origin:"")+"/.netlify/functions/";
    const r=await fetch(fnBase+path,opt);
    if(r.status===404)return {error:"fn_404",status:404};
    if(r.ok)return await r.json();
    return {error:"http_"+r.status,status:r.status};
  }catch(e){return {error:"network"}}
}
async function fetchClientMeta(url){
  try{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),4500);
    const r=await fetch("https://api.microlink.io/?url="+encodeURIComponent(url),{signal:ctl.signal});
    clearTimeout(timer);
    if(r.ok){
      const j=await r.json();
      const d=(j&&j.data)||{};
      const title=stripIgBoilerplate(d.title||"");
      const description=stripIgBoilerplate(d.description||"");
      const image=(d.image&&d.image.url)||"";
      const author=d.author||"";
      if(title||description||image)return {title,description,image,author};
    }
  }catch(e){}
  try{
    const r=await fetch("https://noembed.com/embed?url="+encodeURIComponent(url));
    if(r.ok){
      const j=await r.json();
      if(j&&!j.error&&(j.title||j.thumbnail_url)){
        return {title:j.title||"",description:j.author_name||"",image:j.thumbnail_url||"",author:j.author_name||""};
      }
    }
  }catch(e){}
  return null;
}
function ytThumb(url){try{const u=new URL(url);let id="";if(/youtu\.be$/.test(u.hostname))id=u.pathname.slice(1);else if(/youtube\.com$/.test(u.hostname))id=u.searchParams.get("v")||(u.pathname.match(/\/(shorts|embed)\/([\w-]{6,})/)||[])[2]||"";return id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:""}catch(e){return ""}}
async function cacheThumb(it,src){
  try{
    const fnBase=(location.origin&&location.origin!=="null"?location.origin:"")+"/.netlify/functions/";
    const r=await fetch(fnBase+"img?url="+encodeURIComponent(src));
    if(!r.ok){
      if(it.image.startsWith("/.netlify/")){it.image=src;syncItemInList(it);persist();render();push(it)}
      return;
    }
    const blob=await r.blob();
    if(sb&&user){
      const path=`${user.id}/${it.id}.jpg`;
      const {error}=await sb.storage.from("thumbs").upload(path,blob,{upsert:true,contentType:blob.type||"image/jpeg"});
      if(!error){it.image=sb.storage.from("thumbs").getPublicUrl(path).data.publicUrl+"?v="+(Date.now()%100000);syncItemInList(it);persist();render();push(it);return}
    }
    if(blob.size<120000){const fr=new FileReader();fr.onload=()=>{it.image=fr.result;syncItemInList(it);persist();render();push(it)};fr.readAsDataURL(blob)}
  }catch(e){}
}
async function enrich(it){
  if(it.isDemo)return it;
  const metaRes=await callFn("meta?url="+encodeURIComponent(it.url));
  let ok=(metaRes&&!metaRes.error)?metaRes:null;
  if(!ok||(!ok.title&&!ok.description&&!ok.image)){
    const clientMeta=await fetchClientMeta(it.url);
    if(clientMeta){
      ok={
        title:(ok&&ok.title)||clientMeta.title||"",
        description:(ok&&ok.description)||clientMeta.description||"",
        image:(ok&&ok.image)||clientMeta.image||"",
        author:(ok&&ok.author)||clientMeta.author||""
      };
    }
  }
  const rawTitle=ok?stripIgBoilerplate(ok.title||""):"";
  const rawDesc=ok?stripIgBoilerplate(ok.description||""):stripIgBoilerplate(it.desc||"");
  const rawAuthor=ok?ok.author||"":"";
  const canUpdateTitle=it.auto||isPlaceholderTitle(it.title);

  if(!it.image||/^\/\.netlify\//.test(it.image)){
    const yt=ytThumb(it.url);
    if(yt)it.image=yt;
    else if(ok&&ok.image){
      if(metaRes&&metaRes.error==="fn_404"){it.image=ok.image}
      else{it.image="/.netlify/functions/img?url="+encodeURIComponent(ok.image);cacheThumb(it,ok.image)}
    }
  }

  const existingCustomTitle=(!isPlaceholderTitle(it.title)&&!it.auto)?it.title:"";
  const ai=await callFn("ai",{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({
      url:it.url,
      title:rawTitle||existingCustomTitle,
      description:rawDesc,
      note:it.note,
      author:rawAuthor,
      collections:allCols()
    })
  });

  if(ai&&!ai.error){
    if(canUpdateTitle){
      it.title=ai.title||cleanTitle({title:rawTitle,description:rawDesc},it.url,it.note);
      it.auto=true;
    }
    if(!(it.tags||[]).length){
      it.tags=(ai.tags&&ai.tags.length)?ai.tags:hashtags(rawTitle+" "+rawDesc+" "+(it.note||""));
    }
    it.desc=ai.summary||rawDesc||it.desc||"";
    if(!it.manual){
      const picked=(ai.collection&&ai.collection!=="Inbox")?ai.collection:classify({...it,title:it.title,desc:it.desc});
      it.collection=picked||"Inbox";
    }
    it.ai=true;
    it.lastError="";
  }else{
    if(canUpdateTitle){
      it.title=cleanTitle({title:rawTitle,description:rawDesc},it.url,it.note);
      it.auto=true;
    }
    if(rawDesc&&!it.desc)it.desc=rawDesc;
    if(!(it.tags||[]).length)it.tags=hashtags(rawTitle+" "+rawDesc+" "+(it.note||""));
    if(!it.manual)it.collection=classify(it);
    it.lastError=(ai&&ai.error)||(metaRes&&metaRes.error)||"";
  }
  it.enriched=!!ok||!!it.ai;
  it.tries=(it.tries||0)+1;
  syncItemInList(it);
  persist();render();await push(it);
  return it;
}
let bannerT=null;
function banner(msg,it){
  const b=$("#banner");
  b.innerHTML=`<span>${esc(msg)}</span>${it?`<button class="btn sm" data-edit="${it.id}">Edit</button><button class="btn sm" data-undo="${it.id}">Undo</button>`:""}`;
  b.classList.add("show");clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove("show"),9000);
}
function normUrl(u){try{const x=new URL(u);if(/instagram\.com/.test(x.hostname)){x.search="";x.hash=""}return x.toString()}catch(e){return u}}
function newItem(url){return {id:uid(),url:normUrl(url),title:"",note:"",desc:"",image:"",auto:true,manual:false,collection:"Inbox",tags:[],starred:false,seen:false,created_at:new Date().toISOString()}}

/* ---------- actions ---------- */
function fillCols(sel,val){$("#f-col").innerHTML=`<option value="__auto__" ${val==="__auto__"?"selected":""}>✨ Auto (decide for me)</option>`+allCols().map(c=>`<option ${c===val?"selected":""}>${esc(c)}</option>`).join("")}
function openForm(item){
  state.editing=item?item.id:null;
  state.confirmDel=false;
  $("#dtitle").textContent=item?"Edit idea":"Save a link";
  const d=item||{};
  $("#f-url").value=d.url||"";
  $("#f-title").value=isPlaceholderTitle(d.title)?"":(d.title||"");
  $("#f-note").value=d.note||"";
  $("#f-tags").value=(d.tags||[]).join(", ");
  fillCols("#f-col",item?(item.manual?item.collection:"__auto__"):"__auto__");
  $("#f-del").hidden=!item;
  $("#f-del").textContent="Delete";
  $("#dlg").showModal();
  setTimeout(()=>{($("#f-url").value?$("#f-title"):$("#f-url")).focus()},50);
}
async function saveForm(){
  const url=$("#f-url").value.trim();if(!url)return;
  const typedTitle=$("#f-title").value.trim();
  const tags=$("#f-tags").value.split(",").map(t=>t.trim().replace(/^#/,"").toLowerCase()).filter(Boolean);
  const colVal=$("#f-col").value;
  let it=state.editing?items.find(i=>i.id===state.editing):null;
  const isNew=!it;
  if(isNew){it=newItem(url);it.title=fallbackTitle(url);items.unshift(it);stripDemosIfRealAdded()}
  else if(normUrl(url)!==it.url){it.url=normUrl(url);it.desc="";it.image="";it.enriched=false;delete it.isDemo}
  else{delete it.isDemo}
  it.note=$("#f-note").value.trim();
  it.tags=tags;
  if(typedTitle&&!isPlaceholderTitle(typedTitle)&&typedTitle!==it.title){
    it.title=typedTitle;
    it.auto=false;
  }else if(!typedTitle){
    it.auto=true;
    if(!isNew&&isPlaceholderTitle(it.title))it.title=fallbackTitle(it.url);
  }
  if(colVal==="__auto__"){it.manual=false}
  else if(isNew||colVal!==it.collection){it.collection=colVal;it.manual=true}
  syncItemInList(it);
  persist();render();$("#dlg").close();
  if(isNew||it.auto||!it.manual){
    toast("Saved. Organising…");
    enrich(it).then(()=>toast("Saved to "+it.collection+" ✓"));
  }else{
    toast("Saved ✓");
    push(it);
  }
}
function move(id,col){const it=items.find(i=>i.id===id);if(!it||it.collection===col)return;it.collection=col;it.manual=true;syncItemInList(it);persist();render();push(it);toast("Moved to "+col)}
function openItem(id){const it=items.find(i=>i.id===id);if(!it)return;window.open(it.url,"_blank","noopener");if(!it.seen){it.seen=true;syncItemInList(it);persist();render();push(it)}}

/* ---------- events ---------- */
document.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-col],[data-tag],[data-open],[data-edit],[data-star],[data-undo],[data-scene]");if(!t)return;
  if(t.dataset.scene){applyScene(t.dataset.scene)}
  else if(t.dataset.undo){const id=t.dataset.undo;items=items.filter(i=>i.id!==id);persist();render();removeRemote(id);$("#banner").classList.remove("show");toast("Removed")}
  else if(t.dataset.col!=null){state.col=t.dataset.col;render()}
  else if(t.dataset.tag!=null){state.tag=state.tag===t.dataset.tag?null:t.dataset.tag;render()}
  else if(t.dataset.open){openItem(t.dataset.open)}
  else if(t.dataset.edit){openForm(items.find(i=>i.id===t.dataset.edit))}
  else if(t.dataset.star){const it=items.find(i=>i.id===t.dataset.star);it.starred=!it.starred;syncItemInList(it);persist();render();push(it)}
});
$("#q").addEventListener("input",(e)=>{state.q=e.target.value;render()});
$("#add").onclick=$("#fab").onclick=()=>openForm(null);
$("#f-cancel").onclick=()=>$("#dlg").close();
$("#form").addEventListener("submit",(e)=>{e.preventDefault();saveForm()});
$("#f-del").onclick=()=>{
  if(!state.confirmDel){
    state.confirmDel=true;
    $("#f-del").textContent="Tap again to delete";
    return;
  }
  const id=state.editing;
  items=items.filter(i=>i.id!==id);
  persist();render();$("#dlg").close();removeRemote(id);toast("Deleted");
};
$("#surprise").onclick=surprise;
$("#s-shuffle").onclick=surprise;
$("#s-close").onclick=()=>$("#sdlg").close();
$("#menu").onclick=()=>$("#mdlg").showModal();
$("#m-close").onclick=()=>$("#mdlg").close();
$("#m-bg").onclick=()=>{
  const nextIdx=(SCENE_KEYS.indexOf(curScene)+1)%SCENE_KEYS.length;
  applyScene(SCENE_KEYS[nextIdx]);
  toast("Background scene: "+SCENE_KEYS[nextIdx]);
};
$("#m-resort").onclick=async()=>{
  $("#mdlg").close();
  const todo=items.filter(i=>!i.isDemo&&(i.auto||isPlaceholderTitle(i.title)||!i.manual||!i.image));
  if(!todo.length)return toast("Everything is already sorted ✓");
  toast("Re-sorting "+todo.length+" items…",4000);
  let fn404=false, noKey=false, noTextCount=0, updated=0;
  for(const it of todo){
    const prevT=it.title, prevC=it.collection;
    await enrich(it);
    if(it.lastError==="fn_404")fn404=true;
    else if(it.lastError==="no key")noKey=true;
    else if(it.lastError==="no text")noTextCount++;
    if(it.title!==prevT||it.collection!==prevC||!isPlaceholderTitle(it.title))updated++;
  }
  render();
  if(fn404){
    toast("Netlify Functions returned 404 (deploy via GitHub or Netlify CLI).",5500);
  }else if(noKey){
    toast("GEMINI_API_KEY not found on server — check Netlify Env Vars & trigger a new deploy.",5000);
  }else if(noTextCount===todo.length){
    toast("Instagram hid captions for these reels. Tap ✎ on a card and add a quick note/hint to sort it.",5000);
  }else{
    toast("Done ✓ Updated "+updated+" of "+todo.length+" items",3500);
  }
};
$("#m-col").onclick=()=>{
  $("#mdlg").close();
  $("#c-name").value="";
  $("#cdlg").showModal();
  setTimeout(()=>$("#c-name").focus(),50);
};
$("#c-cancel").onclick=()=>$("#cdlg").close();
$("#cform").addEventListener("submit",(e)=>{
  e.preventDefault();
  const v=$("#c-name").value.trim();
  if(v){
    if(!allCols().includes(v)){extraCols.push(v);persist()}
    $("#cdlg").close();
    render();
    toast("Collection “"+v+"” added ✓");
  }
});
$("#m-theme").onclick=()=>{const cur=document.documentElement.dataset.theme||"light";const nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;safe.set(LS_THEME,nx)};
$("#m-export").onclick=()=>{const b=new Blob([JSON.stringify({items:items.filter(i=>!i.isDemo),extraCols},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="clutterspace-backup.json";a.click();$("#mdlg").close()};
$("#m-import").onclick=()=>$("#m-file").click();
$("#m-file").onchange=async(e)=>{try{const d=JSON.parse(await e.target.files[0].text());items=items.filter(i=>!i.isDemo);const ids=new Set(items.map(i=>i.id));(d.items||[]).forEach(i=>{if(i.url&&!ids.has(i.id||""))items.push({id:i.id||uid(),starred:false,seen:false,created_at:new Date().toISOString(),collection:"Inbox",tags:[],note:"",title:"",...i})});(d.extraCols||[]).forEach(c=>{if(!extraCols.includes(c))extraCols.push(c)});persist();render();toast("Imported ✓");items.forEach(push)}catch(err){toast("That file couldn't be read")}$("#mdlg").close()};
$("#m-login").onclick=()=>{
  $("#mdlg").close();
  $("#l-info").textContent=!sb?"Sync is not set up yet. Add your free Supabase details in config.js (see SETUP.md), then redeploy.":user?"Signed in as "+user.email+". Your saves sync across every device you sign in on.":"First time? Choose Create account. On your other device, just Sign in with the same email and password.";
  $("#l-out").hidden=!user;$("#l-fields").style.display=user?"none":"grid";$("#l-in").hidden=!!user;$("#l-up").hidden=!!user;
  $("#ldlg").showModal();
};
$("#l-cancel").onclick=()=>$("#ldlg").close();
$("#l-out").onclick=async()=>{await sb.auth.signOut();user=null;setSyncLabel();$("#ldlg").close();toast("Signed out")};
function creds(){
  const email=$("#l-email").value.trim(),password=$("#l-pass").value;
  if(!email||!password){toast("Enter email and password");return null}
  if(password.length<6){toast("Password needs 6+ characters");return null}
  return {email,password};
}
async function doSign(mode){
  if(!sb)return toast("Set up Supabase first");
  const c=creds();if(!c)return;
  const btn=mode==="up"?$("#l-up"):$("#l-in");btn.disabled=true;
  try{
    if(mode==="up"){
      const {data,error}=await sb.auth.signUp(c);
      if(error)return toast(error.message);
      if(!data.session){$("#l-info").textContent="Account created, but Supabase is waiting for email confirmation. In Supabase turn off Authentication → Sign In / Providers → Email → “Confirm email”, or confirm via the email we just sent, then press Sign in.";return}
      toast("Account created ✓");
    }else{
      const {error}=await sb.auth.signInWithPassword(c);
      if(error)return toast(/invalid login/i.test(error.message)?"Wrong email or password":error.message);
      toast("Signed in ✓");
    }
    $("#l-pass").value="";$("#ldlg").close();
  }finally{btn.disabled=false}
}
$("#lform").addEventListener("submit",(e)=>{e.preventDefault();doSign("in")});
$("#l-up").onclick=()=>doSign("up");

// drag a card onto a collection chip
let dragId=null;
document.addEventListener("dragstart",(e)=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;dragId=c.dataset.id;c.classList.add("dragging");e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.drop").forEach(n=>n.classList.remove("dragging","drop"));dragId=null});
$("#cols").addEventListener("dragover",(e)=>{const c=e.target.closest(".chip");if(!c||!dragId)return;e.preventDefault();document.querySelectorAll(".chip.drop").forEach(n=>n.classList.remove("drop"));c.classList.add("drop")});
$("#cols").addEventListener("drop",(e)=>{const c=e.target.closest(".chip");if(!c||!dragId)return;e.preventDefault();const col=c.dataset.col;if(col!=="All"&&col!=="★ Starred")move(dragId,col)});

/* ---------- boot ---------- */
if(safe.get(LS_THEME,null))document.documentElement.dataset.theme=safe.get(LS_THEME,null);
applyScene(curScene);
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
function handleShare(){
  const p=new URLSearchParams(location.search);
  const raw=[p.get("url"),p.get("text"),p.get("title")].filter(Boolean).join(" ");
  if(!raw)return;
  const m=raw.match(/https?:\/\/[^\s]+/);
  history.replaceState(null,"",location.pathname);
  if(!m){banner("Nothing to save: the share didn't include a link.");return}
  const url=normUrl(m[0]);
  const extraText=stripIgBoilerplate(raw.replace(/https?:\/\/[^\s]+/g,"").trim());
  const dupe=items.find(i=>!i.isDemo&&i.url===url);
  if(dupe){banner("Already in your library under “"+dupe.collection+"”.",dupe);return}
  const it=newItem(url);
  it.title=fallbackTitle(url);
  if(extraText&&!isPlaceholderTitle(extraText))it.desc=extraText;
  items.unshift(it);stripDemosIfRealAdded();persist();render();push(it);
  banner("✓ Saved. Sorting it for you…",it);
  enrich(it).then(()=>banner("✓ Saved to “"+it.collection+"”: "+it.title,it));
}
render();
async function finishPending(){
  const todo=items.filter(i=>!i.isDemo&&!i.ai&&(i.tries||0)<3&&(i.auto||isPlaceholderTitle(i.title)||!i.manual||!i.image)).slice(0,10);
  for(const it of todo){await enrich(it)}
}
window.addEventListener("load",async()=>{await initSync();handleShare();finishPending()});
})();
</script>
